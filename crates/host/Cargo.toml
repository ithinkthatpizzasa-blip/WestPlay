[package]
name = "westplay-host"
description = "Renders the WestPlay UI in an offscreen WebView2 (WKWebView on macOS) and feeds the frames to the game plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
westplay-mapdata = { path = "../mapdata" }
westplay-setup = { path = "../setup" }
westplay-shared = { path = "../shared", features = ["serde"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "System", "UI_Composition", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm","Win32_System_WinRT_Composition", "UI_Composition_Desktop", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
windows-core = "0.62"
windows-future = "0.3"
windows-numerics = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace", "objc2-core-graphics"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGColorSpace", "CGContext", "CGEvent", "CGEventTypes", "CGImage", "CGBitmapContext", "CGDataProvider", "CGWindow", "CGGeometry"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "std"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSHTTPCookie", "NSObject", "NSRunLoop", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSUUID", "NSValue", "NSGeometry", "NSSet", "NSKeyValueCoding", "NSProcessInfo", "NSEnumerator", "block2"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript", "WKScriptMessage", "WKScriptMessageHandler", "WKNavigationDelegate", "WKNavigation", "WKURLSchemeHandler", "WKURLSchemeTask", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKHTTPCookieStore", "WKSnapshotConfiguration", "WKPreferences", "WKFrameInfo", "WKUIDelegate", "WKNavigationAction", "WKNavigationResponse", "WKWindowFeatures", "block2", "objc2-app-kit"] }

[lints]
workspace = true
