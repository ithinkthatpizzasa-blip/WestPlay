[package]
name = "westplay-plugin"
description = "WestPlay SCS SDK plugin: takes over in-cabin screens in ETS2/ATS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "westplay"
crate-type = ["cdylib"]

[dependencies]
westplay-shared = { path = "../shared" }

[target.'cfg(windows)'.dependencies]
minhook = "0.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[lints]
workspace = true
